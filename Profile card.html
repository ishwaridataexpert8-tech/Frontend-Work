<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Balkrishna Devakonda - Profile</title>
    <style>
        /* पूर्ण स्क्रीनसाठी बॅकग्राउंड रंग */
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* हे तुमचे सुंदर प्रोफाईल कार्ड */
        .profile-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
            max-width: 400px;
            border-top: 5px solid brown; /* वरच्या बाजूला ब्राऊन पट्टी */
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        /* बटण डिझाईन */
        .btn {
            background-color: brown;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 15px;
        }

        /* माऊस नेल्यावर बटणाचा रंग बदलेल */
        .btn:hover {
            background-color: #5a1818;
        }
    </style>
</head>
<body>

    <!-- कार्ड बॉक्स सुरू -->
    <div class="profile-card">
        <h1>Balkrishna Devakonda</h1>
        <p>
            Hello everyone!<br>
            I am working in <strong>Automation Testing</strong>.<br>
            I have 4 years of experience.<br>
            I have knowledge about Manual testing, Core Java, HTML, CSS, JavaScript, SQL, Jira, and GitHub.
        </p>
        <p>Thank you!!!!!!!</p>
        <button class="btn">Follow Me</button>
    </div>
    <!-- कार्ड बॉक्स संपला -->

</body>
</html>
